<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de Artigos | Rádio Escolar</title>
  <meta name="theme-color" content="#070913">
  <link rel="icon" type="image/jpeg" href="assets/logo-radio.jpg">
  <link rel="apple-touch-icon" href="assets/logo-radio.jpg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="word-app-container">
  <header class="word-top-bar"><div class="word-doc-info"><a class="btn-back-link" href="admin.html"><i class="ri-arrow-left-line"></i> Painel</a><span class="word-doc-badge">Editor</span><span class="word-save-status" id="saveStatus"><i class="ri-checkbox-circle-line"></i> Rascunho local</span></div><div class="word-actions-group"><button class="btn-action" type="button" id="previewButton"><i class="ri-eye-line"></i> Pré-visualizar</button><button class="btn-submit-main" type="button" id="publishButton"><i class="ri-send-plane-line"></i> Publicar Artigo</button></div></header>
  <div class="word-ribbon" role="toolbar" aria-label="Ferramentas de formatação">
    <div class="word-tool-group"><select class="word-select-style" id="formatSelect" aria-label="Estilo de parágrafo"><option value="p">Normal</option><option value="h2">Título 2</option><option value="h3">Título 3</option><option value="blockquote">Citação</option></select></div>
    <div class="word-tool-group"><button class="word-tool-btn" data-command="bold" title="Negrito"><strong>B</strong></button><button class="word-tool-btn" data-command="italic" title="Itálico"><em>I</em></button><button class="word-tool-btn" data-command="underline" title="Sublinhado"><u>U</u></button><button class="word-tool-btn" data-command="strikeThrough" title="Riscado"><s>S</s></button><button class="word-tool-btn" data-command="hiliteColor" data-value="#f59e0b" title="Destacar"><i class="ri-mark-pen-line"></i></button></div>
    <div class="word-tool-group"><button class="word-tool-btn" data-command="insertUnorderedList" title="Lista com marcadores"><i class="ri-list-unordered"></i></button><button class="word-tool-btn" data-command="insertOrderedList" title="Lista numerada"><i class="ri-list-ordered"></i></button><button class="word-tool-btn" id="imageButton" title="Adicionar imagem"><i class="ri-image-add-line"></i></button><button class="word-tool-btn" id="linkButton" title="Adicionar ligação"><i class="ri-link"></i></button><button class="word-tool-btn" id="dividerButton" title="Adicionar divisor"><i class="ri-separator"></i></button></div>
    <div class="word-tool-group"><button class="word-tool-btn" data-command="undo" title="Desfazer"><i class="ri-arrow-go-back-line"></i></button><button class="word-tool-btn" data-command="redo" title="Refazer"><i class="ri-arrow-go-forward-line"></i></button><button class="word-tool-btn" data-command="removeFormat" title="Limpar formatação"><i class="ri-format-clear"></i></button></div>
  </div>
  <main class="word-workspace-grid"><section class="word-sheet-wrapper"><div class="word-paper-sheet"><input class="word-doc-title-input" id="titleInput" placeholder="Título do artigo" maxlength="140"><div class="word-editable-body" id="editorBody" contenteditable="true"></div></div></section><aside class="word-sidebar-panel"><section class="word-side-card"><h4><i class="ri-settings-3-line"></i> Publicação</h4><label class="form-label" for="categoryInput">Categoria</label><select class="form-input-lg" id="categoryInput"><option>Evento</option><option>Recrutamento</option><option>Cultura</option><option>Emissão</option><option>Aviso</option><option>Entrevista</option><option>Concurso</option></select><label class="form-label" for="authorInput">Autor / Redator</label><input class="form-input-lg" id="authorInput" value="Equipa da Rádio • EBS Cidadela">
<label class="form-label" for="broadcastDateInput">Data para leitura em antena</label><input class="form-input-lg" id="broadcastDateInput" type="date">
<label class="word-air-checkbox"><input id="onAirInput" type="checkbox"> <span><strong>Aviso para ler em antena</strong><small>Fica destacado no briefing diário.</small></span></label><label class="form-label" for="excerptInput">Resumo / Excerto</label><textarea class="form-input-lg" id="excerptInput" rows="4" maxlength="240" placeholder="Uma frase para os cartões de notícias"></textarea></section><section class="word-side-card"><h4><i class="ri-image-line"></i> Capa do artigo</h4><input class="form-input-lg" id="imageInput" type="url" placeholder="https://..."><div class="word-cover-preview-box" id="coverPreview"><span style="color:var(--text-muted)">Pré-visualização da capa</span></div><div class="word-preset-images"><img class="word-preset-thumb" data-image="https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=1200&q=80" src="https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=300&q=80" alt="Evento escolar"><img class="word-preset-thumb" data-image="https://images.unsplash.com/photo-1478737270239-2f02b77fc618?auto=format&fit=crop&w=1200&q=80" src="https://images.unsplash.com/photo-1478737270239-2f02b77fc618?auto=format&fit=crop&w=300&q=80" alt="Estúdio"><img class="word-preset-thumb" data-image="https://images.unsplash.com/photo-1590602847861-f357a9332bbc?auto=format&fit=crop&w=1200&q=80" src="https://images.unsplash.com/photo-1590602847861-f357a9332bbc?auto=format&fit=crop&w=300&q=80" alt="Microfone"></div></section></aside></main>
  <div class="word-bottom-statusbar"><span id="wordCount">0 palavras</span><span>As alterações ficam guardadas ao publicar.</span></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/editor.js"></script>
</body>
</html>
