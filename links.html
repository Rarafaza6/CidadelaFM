<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links Rápidos | Rádio Escolar • EBS Cidadela & Município de Cascais</title>
  <meta name="description"
    content="Acesso rápido aos links oficiais da Rádio Escolar da EBS da Cidadela em parceria com a Câmara Municipal de Cascais.">
  <meta name="theme-color" content="#06080f">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Links Rápidos | Rádio Escolar EBS Cidadela">
  <meta property="og:description"
    content="Links oficiais, pedidos de música, inscrições e contactos da nossa comunidade.">
  <meta property="og:image" content="assets/logo-radio.jpg">
  <link rel="icon" type="image/jpeg" href="assets/logo-radio.jpg">
  <link rel="apple-touch-icon" href="assets/logo-radio.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/maintenance-guard.js"></script>
</head>

<body style="background: #06080f;">

  <main class="linktree-wrapper">
    <!-- Ambient glowing orbs background -->
    <div class="hv2-hero-bg" aria-hidden="true" style="position: fixed; inset: 0; pointer-events: none;">
      <div class="hv2-orb hv2-orb-1" style="width: 500px; height: 500px; top: -100px; left: -100px;"></div>
      <div class="hv2-orb hv2-orb-2" style="width: 450px; height: 450px; bottom: -100px; right: -50px;"></div>
      <div class="hv2-hero-grid"></div>
    </div>

    <div class="linktree-shell hv2-animate">
      <header class="linktree-hero">
        <div class="linktree-brand-line">
          <img src="assets/logo-radio.jpg" alt="Logótipo da Rádio Escolar">
        </div>
        <h1>Rádio Escolar</h1>
        <p class="linktree-handle">EBS Cidadela • Cascais</p>
        <p class="linktree-intro">Links oficiais, pedidos de música, podcasts e mensagens para a nossa comunidade escolar.</p>
      </header>

      <div class="news-search-box" style="margin-bottom: 1.5rem;">
        <i class="ri-search-line" aria-hidden="true"></i>
        <input id="linkSearchInput" type="search" placeholder="Procurar um link..." aria-label="Procurar um link">
      </div>

      <div id="linktreeContainer" class="linktree-list" aria-live="polite">
        <!-- Renderizado via js/links.js -->
      </div>

      <footer class="linktree-footer">
        <a href="index.html" class="hv2-back-btn" style="margin: 0 auto 0.75rem; display: inline-flex;">
          <i class="ri-arrow-left-line" aria-hidden="true"></i> Voltar ao site principal
        </a>
        <div>
          &copy; 2026 Rádio Escolar &bull;
          <a href="https://aecidadela.pt" target="_blank" rel="noopener noreferrer" style="color: #94a3b8; text-decoration: none;">EBS da Cidadela</a>
          em parceria com a
          <a href="https://www.cascais.pt" target="_blank" rel="noopener noreferrer" style="color: #94a3b8; text-decoration: none;">Câmara Municipal de Cascais</a>
        </div>
      </footer>
    </div>
  </main>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/links.js"></script>
</body>

</html>
